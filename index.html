<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光の導き | スピリチュアルセッション</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #faf6f0;
            color: #4a4a4a;
            margin: 0;
            padding: 0;
            line-height: 1.8;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
        header h1 {
            font-size: 24px;
            color: #6b5b7b;
            margin: 20px 0 5px 0;
            letter-spacing: 2px;
        }
        header p {
            font-size: 14px;
            color: #8e8e8e;
            margin-bottom: 30px;
        }
        section {
            background-color: #ffffff;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        h2 {
            font-size: 18px;
            color: #6b5b7b;
            border-bottom: 1px solid #f0e6df;
            padding-bottom: 5px;
            margin-top: 0;
        }
        h3 {
            font-size: 15px;
            color: #c06c84;
            margin-bottom: 5px;
        }
        p {
            font-size: 14px;
            margin: 0 0 10px 0;
        }
        /* Estilo do Formulário */
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #6b5b7b;
            margin-bottom: 5px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #e0d5cb;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fffdfb;
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
        button {
            width: 100%;
            background-color: #c06c84;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #b05c74;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="images/pexels-ray-lei-2809836-13865884.jpeg" alt="光の導き">

        <header>
            <h1>光の導き</h1>
            <p>恋愛・運命・未来を導くスピリチュアルセッション</p>
        </header>

        <main>
            <section>
                <h2>ようこそ</h2>
                <p>恋愛、人間関係、仕事、人生の悩みに寄り添い、心の平穏と前向きな人生をサポートします。</p>
            </section>

            <section>
                <h2>サービス内容</h2>
                <h3>恋愛相談</h3>
                <p>恋愛やパートナーとの関係についての相談。</p>
                <h3>人生相談</h3>
                <p>将来や人生の方向性についての相談。</p>
                <h3>スピリチュアル相談</h3>
                <p>精神的なサポートと自己成長のための相談。</p>
            </section>

            <section>
                <h2>個人スピリチュアル相談</h2>
                <p><strong>60分　¥10,000</strong></p>
            </section>

            <section>
                <h2>特別相談窓口 (お問い合わせ)</h2>
                <p style="color: #8e8e8e; font-size: 12px; margin-bottom: 15px;">※お名前とご相談内容をご記入ください。折り返しご連絡いたします。</p>
                
                <form action="https://formspree.io/f/mnjrbnnw" method="POST">
                    <div class="form-group">
                        <label for="name">お名前（フルネーム）/ Nome Completo</label>
                        <input type="text" id="name" name="name" required placeholder="例：山田 花子">
                    </div>
                    
                    <div class="form-group">
                        <label for="message">ご相談内容 / Sua Pergunta</label>
                        <textarea id="message" name="message" required placeholder="こちらにご相談内容をご記入ください..."></textarea>
                    </div>
                    
                    <button type="submit">送信する (Enviar Pergunta)</button>
                </form>
            </section>
        </main>
    </div>

</body>
</html>
